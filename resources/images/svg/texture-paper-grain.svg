<!-- Paper texture: render as an absolutely-positioned full-size overlay (pointer-events:none) over the page background. Two layers: low-frequency mottle + fine grain. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><filter id="mottle"><feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.05 0"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.24  0 0 0 0 0.2  0 0 0 0.10 0"/></filter><rect width="100%" height="100%" filter="url(#mottle)"/><rect width="100%" height="100%" filter="url(#grain)"/></svg>
